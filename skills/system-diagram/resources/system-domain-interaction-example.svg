<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 10 1090 430" role="img" aria-labelledby="system-domain-interaction-example-title system-domain-interaction-example-desc" data-diagram-style="infrastructure-v1" data-review-id="diagram.domain-example.system-domain-interaction-example.svg"><title id="system-domain-interaction-example-title">Which domain building blocks own facts, derived state, and planning?</title><desc id="system-domain-interaction-example-desc">A product-domain map showing authoritative evidence becoming an accepted fact, derived current state, and a read-only lens while planning stays separate under an invariant rail.</desc><!-- svg-source:system-diagram --><!-- svg-spec-sha256:aa18b42316e6ae241075e13aa0f03cd0594af37beceb06252b5f76fa68bcf201 --><metadata>{"schemaVersion":"system-diagram-v1","style":"infrastructure-v1"}</metadata><defs><style>
.diagram-canvas {
  fill: #fff;
}

.diagram-grid {
  opacity: .82;
}

.diagram-node,
.diagram-edge,
.diagram-edge-label,
.diagram-group {
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  text-rendering: geometricPrecision;
}

.diagram-node__surface {
  fill: #fff;
  stroke: #d8d8d3;
  stroke-width: 1.25;
  vector-effect: non-scaling-stroke;
}

.diagram-node__title {
  fill: #171717;
  font-weight: 650;
  letter-spacing: -.01em;
}

.diagram-node__detail {
  fill: #666663;
  font-weight: 450;
}

.diagram-node__kind {
  fill: #73736f;
  font-size: 14px;
  font-weight: 750;
  letter-spacing: .1em;
}

.diagram-node__accent,
.diagram-node--repository .diagram-node__accent,
.diagram-node--domain .diagram-node__accent,
.diagram-node--policy .diagram-node__accent {
  fill: #73736f;
}

.diagram-node--decision .diagram-node__accent,
.diagram-node--warning .diagram-node__accent {
  fill: #b45309;
}

.diagram-node--feedback .diagram-node__accent,
.diagram-node--success .diagram-node__accent {
  fill: #047857;
}

.diagram-node--risk .diagram-node__accent {
  fill: #dc2626;
}

.diagram-node__dot {
  fill: #fff;
  stroke: #d8d8d3;
  stroke-width: 1.25;
  vector-effect: non-scaling-stroke;
}

.diagram-node--entry .diagram-node__dot {
  fill: #73736f;
  stroke: #73736f;
}

.diagram-node--feedback .diagram-node__dot,
.diagram-node--success .diagram-node__dot {
  fill: #047857;
  stroke: #047857;
}

.diagram-node--risk .diagram-node__dot {
  fill: #dc2626;
  stroke: #dc2626;
}

.diagram-edge__path {
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.diagram-edge--primary .diagram-edge__path {
  stroke: #0070f3;
}

.diagram-edge--secondary .diagram-edge__path,
.diagram-edge--boundary .diagram-edge__path {
  stroke: #73736f;
}

.diagram-edge--boundary .diagram-edge__path {
  stroke-dasharray: 5 5;
}

.diagram-edge--feedback .diagram-edge__path,
.diagram-edge--success .diagram-edge__path {
  stroke: #047857;
}

.diagram-edge--warning .diagram-edge__path {
  stroke: #b45309;
  stroke-dasharray: 6 5;
}

.diagram-edge--risk .diagram-edge__path {
  stroke: #dc2626;
  stroke-dasharray: 6 5;
}

.diagram-edge-label__surface {
  fill: #fff;
  stroke: #e5e5e1;
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}

.diagram-edge-label__text {
  fill: #52524f;
  font-weight: 650;
  letter-spacing: .01em;
}

.diagram-edge-label--feedback .diagram-edge-label__text,
.diagram-edge-label--success .diagram-edge-label__text {
  fill: #047857;
}

.diagram-edge-label--warning .diagram-edge-label__text {
  fill: #92400e;
}

.diagram-edge-label--risk .diagram-edge-label__text {
  fill: #b91c1c;
}

.diagram-group__surface {
  fill: #fafafa;
  fill-opacity: .7;
  stroke: #cfcfca;
  stroke-width: 1;
  stroke-dasharray: 6 6;
  vector-effect: non-scaling-stroke;
}

.diagram-group--ownership .diagram-group__surface {
  fill: #fafafa;
  fill-opacity: .72;
  stroke: #b7b7b2;
}

.diagram-group--proposed .diagram-group__surface {
  fill: #fff7ed;
  fill-opacity: .5;
  stroke: #d7a76d;
}

.diagram-group__label-bg {
  fill: #fff;
}

.diagram-group__label {
  fill: #666663;
  font-size: 14px;
  font-weight: 750;
  letter-spacing: .08em;
}

.diagram-reveal {
  opacity: 1;
  transform: none;
}
