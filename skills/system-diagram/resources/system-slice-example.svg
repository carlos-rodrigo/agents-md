2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><rect class="diagram-canvas" x="30" y="10" width="860" height="890"></rect><rect class="diagram-grid" x="30" y="10" width="860" height="890" fill="url(#system-slice-example--grid)"></rect><g class="diagram-groups"></g><g class="diagram-edges"><g class="diagram-edge diagram-edge--primary diagram-reveal" style="--reveal-delay:0ms" data-review-id="diagram.example.system-slice-example.edge-route-to-endpoint"><path class="diagram-edge__path" d="M210 150L210 220" marker-end="url(#system-slice-example--arrow-primary)"></path></g><g class="diagram-edge diagram-edge--primary diagram-reveal" style="--reveal-delay:120ms" data-review-id="diagram.example.system-slice-example.edge.endpoint-to-use-case"><path class="diagram-edge__path" d="M210 330L210 400" marker-end="url(#system-slice-example--arrow-primary)"></path></g><g class="diagram-edge diagram-edge--primary diagram-reveal" style="--reveal-delay:240ms" data-review-id="diagram.example.system-slice-example.edge.use-case-to-domain"><path class="diagram-edge__path" d="M210 510L210 580" marker-end="url(#system-slice-example--arrow-primary)"></path></g><g class="diagram-edge diagram-edge--primary diagram-reveal" style="--reveal-delay:360ms" data-review-id="diagram.example.system-slice-example.edge.domain-to-repository"><path class="diagram-edge__path" d="M210 690L210 760" marker-end="url(#system-slice-example--arrow-primary)"></path></g><g class="diagram-edge diagram-edge--feedback diagram-reveal" style="--reveal-delay:480ms" data-review-id="diagram.example.system-slice-example.edge.use-case-to-feedback"><path class="diagram-edge__path" d="M360 455L540 455" marker-end="url(#system-slice-example--arrow-feedback)"></path></g></g><g class="diagram-nodes"><g class="diagram-node diagram-node--entry diagram-reveal" style="--reveal-delay:0ms" data-review-id="diagram.example.system-slice-example.node-quick-create" aria-labelledby="system-slice-