one" stroke="#dc2626" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs><rect class="diagram-canvas" x="24" y="4" width="982" height="822"></rect><rect class="diagram-grid" x="24" y="4" width="982" height="822" fill="url(#report-validation-flow--grid)"></rect><g class="diagram-groups"></g><g class="diagram-edges"><g class="diagram-edge diagram-edge--primary diagram-reveal" style="--reveal-delay:0ms" data-review-id="report-validation-flow.edge.selects-artifact"><path class="diagram-edge__path" d="M210 160L210 230" marker-end="url(#report-validation-flow--arrow-primary)"></path></g><g class="diagram-edge diagram-edge--primary diagram-reveal" style="--reveal-delay:120ms" data-review-id="report-validation-flow.edge.records-evidence"><path class="diagram-edge__path" d="M210 390L210 460" marker-end="url(#report-validation-flow--arrow-primary)"></path></g><g class="diagram-edge diagram-edge--primary diagram-reveal" style="--reveal-delay:240ms" data-review-id="report-validation-flow.edge.informs-decision"><path class="diagram-edge__path" d="M210 600L210 670" marker-end="url(#report-validation-flow--arrow-primary)"></path></g></g><g class="diagram-nodes"><g class="diagram-node diagram-node--entry diagram-reveal" style="--reveal-delay:0ms" data-review-id="report-validation-flow.node.finished-report" aria-labelledby="report-validation-flow--finished-report-text"><rect class="diagram-node__surface" x="60" y="40" width="300" height="120" rx="10" filter="url(#report-validation-flow--shadow)"></rect><rect class="diagram-node__accent" x="60" y="52" width="3" height="96" rx="1.5"></rect><circle class="diagram-node__dot" cx="343" cy="57" r="3.5"></circle><text class="diagram-node__kind" x="80" y="63">ENTRY</text><text id="report-validation-flow--finished-report-text" class="diagram-node__title" x="80" y="87" font-size="16">Finished HTML report</text><text class="diagram-node__detail" x="80" y="110" font-size="14"><tspan x="80" y="110">Owner: report author</tspan><tspan x="80" y="129">One immutable artifact</tspan></text></g><g class="diagram-node diagram-node--service diagram-reveal" style="--reveal-delay:120ms" data-review-id="report-validation-flow.node.required-checks" aria-labelledby="report-validation-flow--required-checks-text"><rect class="diagram-node__surface" x="60" y="230" width="300" height="160" rx="10" filter="url(#report-validation-flow--shadow)"></rect><rect class="diagram-node__accent" x="60" y="242" width="3" height="136" rx="1.5"></rect><circle class="diagram-node__dot" cx="343" cy="247" r="3.5"></circle><text class="diagram-node__kind" x="80" y="253">SERVICE</text><text id="report-validation-flow--required-checks-text" class="diagram-node__title" x="80" y="277" font-size="16">Required checks</text><text class="diagram-node__detail" x="80" y="300" font-size="14"><tspan x="80" y="300">Owner: validator</tspan><tspan x="80" y="319">Visual · functional</tspan><tspan x="80" y="338">Declared browser matrix</tspan></text></g><g class="diagram-node diagram-node--decision diagram-reveal" style="--reveal-delay:240ms" data-review-id="report-validation-flow.node.readiness-result" aria-labelledby="report-validation-flow--readiness-result-text"><rect class="diagram-node__surface" x="60" y="460" width="300" height="140" rx="10" filter="url(#report-validation-flow--shadow)"></rect><rect class="diagram-node__accent" x="60" y="472" width="3" height="116" rx="1.5"></rect><circle class="diagram-node__dot" cx="343" cy="477" r="3.5"></circle><text class="diagram-node__kind" x="80" y="483">DECISION</text><text id="report-validation-flow--readiness-result-text" class="diagram-node__title" x="80" y="507" font-size="16">Readiness result</text><text class="diagram-node__detail" x="80" y="530" font-size="14"><tspan x="80" y="530">Owner: validator</tspan><tspan x="80" y="549">Ready · failed · incomplete</tspan></text></g><g class="diagram-node diagram-node--decision diagram-reveal" style="--reveal-delay:360ms" data-review-id="report-validation-flow.node.sharing-decision" aria-labelledby="report-validation-flow--sharing-decision-text"><rect class="diagram-node__surface" x="60" y="670" width="300" height="120" rx="10" filter="url(#report-validation-flow--shadow)"></rect><rect class="diagram-node__accent" x="60" y="682" width="3" height="96" rx="1.5"></rect><circle class="diagram-node__dot" cx="343" cy="687" r="3.5"></circle><text class="diagram-node__kind" x="80" y="693">DECISION</text><text id="report-validation-flow--sharing-decision-text" class="diagram-node__title" x="80" y="717" font-size="16">Sharing decision</text><text class="diagram-node__detail" x="80" y="740" font-size="14"><tspan x="80" y="740">Owner: report author</tspan><tspan x="80" y="759">Share or resolve evidence</tspan></text></g><g class="diagram-node diagram-node--policy diagram-reveal" style="--reveal-delay:480ms" data-review-id="report-validation-flow.node.readiness-policy" aria-labelledby="report-validation-flow--readiness-policy-text"><rect class="diagram-node__surface" x="470" y="350" width="500" height="150" rx="10" filter="url(#report-validation-flow--shadow)"></rect><rect class="diagram-node__accent" x="470" y="362" width="3" height="126" rx="1.5"></rect><circle class="diagram-node__dot" cx="953" cy="367" r="3.5"></circle><text class="diagram-node__kind" x="490" y="373">POLICY</text><text id="report-validation-flow--readiness-policy-text" class="diagram-node__title" x="490" y="397" font-size="17">Invariant / policy rail</text><text class="diagram-node__detail" x="490" y="420" font-size="15"><tspan x="490" y="420">Ready requires every mandatory check</tspan><tspan x="490" y="440">to pass against one artifact</tspan><tspan x="490" y="460">Not run never means passed</tspan></text></g></g><g class="diagram-edge-labels"><g class="diagram-edge-label diagram-edge-label--primary diagram-reveal" style="--reveal-delay:48ms" data-review-id="report-validation-flow.edge-label.selects-artifact"><rect class="diagra